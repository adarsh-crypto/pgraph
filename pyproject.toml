[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgraph"
version = "0.4.0"
description = "Local, portable, graph-based project memory for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pgraph = "pgraph.cli:main"
pgraph-mcp = "pgraph.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pgraph*"]
